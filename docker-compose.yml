version: '3.8'

services:
  # The Spring Boot Application
  backend:
    build: .
    container_name: smart-attendance-backend
    ports:
      - "8082:8080"
    environment:
      # Inject Docker networking so Spring Boot connects to the db container
      # Note the trustServerCertificate=true is often required for MSSQL in Docker
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://db:1433;databaseName=master;encrypt=false;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=SA
      - SPRING_DATASOURCE_PASSWORD=YourStrong@Passw0rd
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - attendance-network
  # The MS SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smart-attendance-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - attendance-network

volumes:
  # Persistent volume for database data so it isn't lost on restart
  sqlserver_data:

networks:
  attendance-network:
    driver: bridge
